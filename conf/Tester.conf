server {
    listen 9080;
    server_name localhost;
    client_max_body_size 200M;

    location / {
        root ./www;
        methods GET;
        index index.html;
    }

    location *.bla {
        methods POST;
        cgi_pass ./cgi_tester; 
    }

    location /post_body {
        methods POST;
        client_max_body_size 100;
    }

    location /directory {
        root ./YoupiBanane;
        methods GET POST;
        index youpi.bad_extension;
    }
}