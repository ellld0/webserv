server {
    listen 9080;
    server_name localhost;
    client_max_body_size 10M;
    error_page 404 /404.html;
    error_page 500 /50x.html;
    error_page 502 /50x.html;
    error_page 503 /50x.html;
    error_page 504 /50x.html;

    location / {
        root ./www;
        methods GET POST;
        index index.html;
        directory_listing on;
    }

    location /uploads {
        methods POST GET DELETE;
        upload ./www/uploads;
    }

    location /google {
		methods GET;
        return 301 https://www.google.com;
    }

	location /copy {
		root ./www2;
		methods GET;
		index index.html;
	}
}

server {
    listen 9081;
    server_name localhost_directory;
    client_max_body_size 1M;

    location / {
        root ./www2/;
        methods GET;
        index index_copy.html;
        directory_listing off;
    }
}

server {
    listen 9082;
    server_name localhost_size_limit;
    client_max_body_size 1K;

    location / {
        root ./www/;
        methods GET POST;
        index index.html;
        directory_listing off;
    }
}

server {
    listen 127.0.0.2:9083;
    server_name localhost_interface;
    client_max_body_size 10M;
    error_page 404 /404.html;
    error_page 500 /50x.html;
    error_page 502 /50x.html;
    error_page 503 /50x.html;
    error_page 504 /50x.html;

    location / {
        root ./www2;
        methods GET POST;
        index index.html;
        directory_listing on;
    }

    location /uploads {
        methods GET POST DELETE;
        upload ./www/uploads;
    }

    location /google {
		methods GET;
        return 301 https://www.google.com;
    }   
}