<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404 | Page Not Found</title>
	<style>
		:root {
			--bg-top: #f4efe6;
			--bg-bottom: #cfd8cd;
			--ink: #1f2a2e;
			--muted: #4a5b60;
			--card: rgba(255, 255, 255, 0.72);
			--line: rgba(31, 42, 46, 0.14);
			--accent: #1f6f78;
			--accent-strong: #13474d;
			--shadow: 0 20px 48px rgba(13, 26, 29, 0.2);
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			min-height: 100%;
		}

		body {
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
			color: var(--ink);
			background:
				radial-gradient(900px 500px at 8% 10%, rgba(255, 255, 255, 0.6), transparent 60%),
				radial-gradient(600px 420px at 90% 80%, rgba(31, 111, 120, 0.2), transparent 65%),
				linear-gradient(170deg, var(--bg-top), var(--bg-bottom));
			display: grid;
			place-items: center;
			padding: 28px;
			overflow: hidden;
		}

		.shape {
			position: fixed;
			border: 1px solid var(--line);
			pointer-events: none;
			animation: drift 15s ease-in-out infinite;
			z-index: 0;
		}

		.shape-a {
			width: 220px;
			height: 220px;
			border-radius: 26px;
			top: -40px;
			right: 8%;
			transform: rotate(18deg);
		}

		.shape-b {
			width: 170px;
			height: 170px;
			border-radius: 999px;
			bottom: 8%;
			left: 4%;
			animation-delay: 1.5s;
		}

		.shell {
			width: min(760px, 100%);
			position: relative;
			z-index: 1;
		}

		.panel {
			background: var(--card);
			backdrop-filter: blur(8px);
			border: 1px solid var(--line);
			border-radius: 24px;
			box-shadow: var(--shadow);
			padding: 34px;
			animation: reveal 640ms cubic-bezier(0.2, 0.7, 0.2, 1);
		}

		.kicker {
			margin: 0;
			text-transform: uppercase;
			letter-spacing: 0.14em;
			font-size: 12px;
			color: var(--muted);
			font-weight: 700;
		}

		.code {
			margin: 10px 0 0;
			font-size: clamp(64px, 14vw, 128px);
			line-height: 0.9;
			color: var(--accent-strong);
			text-shadow: 0 2px 0 rgba(255, 255, 255, 0.8);
		}

		h1 {
			margin: 14px 0 8px;
			font-size: clamp(24px, 5vw, 38px);
			line-height: 1.15;
		}

		p {
			margin: 0;
			color: var(--muted);
			max-width: 62ch;
			line-height: 1.6;
		}

		.actions {
			margin-top: 26px;
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
		}

		.btn {
			border-radius: 999px;
			border: 1px solid transparent;
			padding: 11px 18px;
			text-decoration: none;
			font-weight: 700;
			transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
		}

		.btn-primary {
			background: var(--accent);
			color: #f6fbfb;
			box-shadow: 0 8px 18px rgba(19, 71, 77, 0.3);
		}

		.btn-primary:hover {
			transform: translateY(-1px);
			background: #215f66;
		}

		.btn-secondary {
			background: rgba(255, 255, 255, 0.65);
			border-color: var(--line);
			color: var(--ink);
		}

		.btn-secondary:hover {
			transform: translateY(-1px);
			box-shadow: 0 6px 16px rgba(13, 26, 29, 0.12);
		}

		.hint {
			margin-top: 18px;
			font-size: 14px;
			color: #54676d;
		}

		@keyframes reveal {
			from {
				opacity: 0;
				transform: translateY(18px) scale(0.99);
			}

			to {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
		}

		@keyframes drift {
			0%,
			100% {
				transform: translateY(0) rotate(0deg);
			}

			50% {
				transform: translateY(-10px) rotate(4deg);
			}
		}

		@media (max-width: 600px) {
			.panel {
				padding: 24px;
				border-radius: 18px;
			}

			.actions {
				gap: 10px;
			}

			.btn {
				width: 100%;
				text-align: center;
			}
		}
	</style>
</head>
<body>
	<div class="shape shape-a" aria-hidden="true"></div>
	<div class="shape shape-b" aria-hidden="true"></div>

	<main class="shell">
		<section class="panel">
			<p class="kicker">HTTP Error</p>
			<p class="code">404</p>
			<h1>Page Not Found</h1>
			<p>
				The resource you requested could not be found on this server.
				Check the address you entered or return to the home page.
			</p>

			<div class="actions">
				<a class="btn btn-primary" href="/">Back to Home</a>
				<a class="btn btn-secondary" href="javascript:history.back()">Go Back</a>
			</div>

			<p class="hint">If the issue continues, review your server routes and files.</p>
		</section>
	</main>
</body>
</html>
