<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebServ 1984</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --dark-bg: #050510;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--dark-bg);
            color: var(--neon-cyan);
            font-family: 'VT323', monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Efeito de linhas da TV de tubo (CRT Scanlines) */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Grade Synthwave no fundo */
        .grid-bg {
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 200%;
            height: 150%;
            background-image: 
                linear-gradient(var(--neon-pink) 2px, transparent 2px),
                linear-gradient(90deg, var(--neon-pink) 2px, transparent 2px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            animation: moveGrid 5s linear infinite;
            z-index: 0;
            opacity: 0.3;
        }

        @keyframes moveGrid {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        /* Container Principal */
        .terminal {
            position: relative;
            z-index: 1;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan), inset 0 0 10px var(--neon-cyan);
            border-radius: 10px;
        }

        h1 {
            font-size: 4rem;
            margin: 0 0 20px 0;
            color: #fff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink),
                0 0 80px var(--neon-pink);
        }

        p {
            font-size: 1.5rem;
            margin: 10px 0;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .sys-info {
            margin-top: 30px;
            text-align: left;
            font-size: 1.2rem;
            color: #ffcc00;
            text-shadow: 0 0 5px #ffcc00;
        }

        /* Cursor Piscante */
        .cursor {
            display: inline-block;
            width: 12px;
            height: 1.2rem;
            background-color: var(--neon-cyan);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    
    <div class="terminal">
        <h1>WEBSERV 1.0</h1>
        <p>CONEXÃO ESTABELECIDA COM SUCESSO</p>

        
        <div class="sys-info">
            > STATUS: OPERACIONAL<br>
            > SOCKETS: NON-BLOCKING<br>
            > MULTIPLEXING: POLL()<br>
            > AGUARDANDO COMANDOS<span class="cursor"></span>
        </div>
    </div>
</body>
</html>
